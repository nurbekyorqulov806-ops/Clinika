{% extends 'base.html' %}
{% block title %}Kirish — MediCare{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-heart-pulse-fill" style="font-size:2.5rem; color:var(--primary);"></i>
      <h3 class="fw-bold mt-2">Tizimga kirish</h3>
      <p class="text-muted">Hisobingizga kiring</p>
    </div>
    <form method="post" class="form-clinic">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Foydalanuvchi nomi</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label">Parol</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-clinic w-100 py-2">Kirish</button>
    </form>
    <p class="text-center mt-4 mb-0 text-muted">
      Hisobingiz yo'qmi? <a href="{% url 'accounts:register' %}">Ro'yxatdan o'ting</a>
    </p>
  </div>
</div>
{% endblock %}
